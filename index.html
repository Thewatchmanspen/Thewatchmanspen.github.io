<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>The Watchman’s Hour</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@300;600&display=swap" rel="stylesheet">

<style>
:root { --gold: #D4AF37; --void: #050505; --text: #E0E0E0; }
body { margin:0; background: var(--void); color: var(--text); font-family: 'Montserrat', sans-serif; overflow: hidden; }

/* BACKGROUND */
#bg-video-main { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: -10; filter: brightness(0.12); }

/* NAVIGATION */
.hamburger { position: fixed; top: 25px; right: 25px; font-size: 1.5rem; cursor: pointer; z-index: 10001; background: #000; padding: 12px; border: 1px solid var(--gold); color: var(--gold); border-radius: 50%; }
.nav-menu { position: fixed; top: 0; right: -100%; height: 100%; width: 100%; max-width: 320px; background: #000; border-left: 1px solid var(--gold); z-index: 10000; transition: 0.5s; display: flex; flex-direction: column; padding-top: 80px; }
.nav-menu.open { right: 0; }
.nav-menu a { color: white; text-decoration: none; padding: 20px 40px; border-bottom: 1px solid rgba(212,175,55,0.1); font-family: 'Cinzel'; font-size: 0.85rem; letter-spacing: 2px; }

/* PAGE SYSTEM */
.page { position: absolute; inset: 0; width: 100%; height: 100vh; display: none; overflow-y: auto; padding: 100px 20px 60px; box-sizing: border-box; background: rgba(0,0,0,0.85); backdrop-filter: blur(15px); }
.page.active { display: block; animation: pageFade 0.4s ease forwards; }
@keyframes pageFade { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

/* DESIGNS */
.design-tabs { display: flex; justify-content: center; gap: 15px; margin-bottom: 40px; border-bottom: 1px solid #333; padding-bottom: 15px; }
.tab-btn { background: transparent; border: none; color: #888; font-family: 'Cinzel'; cursor: pointer; padding: 8px 15px; letter-spacing: 2px; }
.tab-btn.active-tab { color: var(--gold); border-bottom: 2px solid var(--gold); }
.design-grid { display: none; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 15px; max-width: 1300px; margin: auto; }
.design-grid.active-section { display: grid; }
.design-card { border: 1px solid #222; height: 350px; background: #000; overflow: hidden; position: relative; }
.design-card img, .design-card video { width: 100%; height: 100%; object-fit: cover; }

/* CONTACT & SOCIALS */
.contact-box { text-align: center; max-width: 500px; margin: auto; background: rgba(255,255,255,0.05); padding: 40px; border: 1px solid var(--gold); border-radius: 8px; }
.social-links { display: flex; justify-content: center; gap: 25px; margin-top: 30px; font-size: 2.2rem; }
.social-links a { color: var(--gold); transition: 0.3s; text-decoration: none; }
.social-links a:hover { transform: scale(1.2); filter: drop-shadow(0 0 10px var(--gold)); }

/* READER - CALIBRI */
#reader { display: none; position: fixed; inset: 0; background: #050505; z-index: 20000; overflow-y: auto; padding: 100px 24px; }
.reader-content { max-width: 800px; margin: auto; font-family: 'Calibri', sans-serif; line-height: 1.6; font-size: 1.3rem; color: #d1d1d1; }
.reader-content h1 { font-family: 'Cinzel'; color: var(--gold); text-align: center; }

.section-title { text-align: center; font-family: 'Cinzel'; color: var(--gold); margin-bottom: 40px; font-size: 2.2rem; }
.wa-float { position: fixed; bottom: 30px; right: 30px; background: #25d366; width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; color: white; z-index: 10001; text-decoration: none; }
</style>
</head>
<body>

<video id="bg-video-main" src="animate 5.mp4" autoplay muted loop playsinline></video>

<div class="hamburger" onclick="toggleNav()"><i class="fas fa-bars"></i></div>

<nav class="nav-menu" id="nav-menu">
    <a href="#" onclick="showPage('home')">Home</a>
    <a href="#" onclick="showPage('designs')">Designs</a>
    <a href="#" onclick="showPage('stories')">Stories</a>
    <a href="#" onclick="showPage('game-page')">The Watchman’s Hour (Game)</a>
    <a href="#" onclick="showPage('contact')">Contact</a>
</nav>

<div id="home" class="page active" style="display: flex; flex-direction: column; align-items: center; background: transparent; padding-top: 25vh;">
    <h1 style="font-family:'Cinzel'; font-size: clamp(2rem, 9vw, 5.5rem); color: var(--gold); margin: 0; text-align:center;">THE WATCHMAN’S PEN</h1>
    <p style="letter-spacing: 12px; color: #888; font-size: 0.8rem; margin-top: 15px;">IMPRESSING BEYOND REPAIR</p>
    <button onclick="showPage('designs')" style="margin-top:50px; padding: 18px 40px; border: 1px solid var(--gold); background: transparent; color: var(--gold); font-family: 'Cinzel'; cursor: pointer; letter-spacing: 3px; font-weight: bold;">VIEW DESIGNS</button>
</div>

<div id="designs" class="page">
    <h1 class="section-title">Designs</h1>
    <div class="design-tabs">
        <button class="tab-btn active-tab" onclick="filterDesigns('animations', this)">Animations</button>
        <button class="tab-btn" onclick="filterDesigns('posters', this)">Posters</button>
        <button class="tab-btn" onclick="filterDesigns('logos', this)">Logos</button>
    </div>

    <div id="animations" class="design-grid active-section">
        <div class="design-card"><video src="animate.mp4" muted loop onmouseover="this.play()" onmouseout="this.pause()"></video></div>
        <div class="design-card"><video src="Animate 1.mp4" muted loop onmouseover="this.play()" onmouseout="this.pause()"></video></div>
    </div>

    <div id="logos" class="design-grid">
        <div class="design-card"><img src="portfolio 2.jpg"></div>
        <div class="design-card"><img src="portfolio 4.jpg"></div>
    </div>
</div>

<div id="stories" class="page">
    <h1 class="section-title">Master Scrolls</h1>
    <div id="story-container" style="max-width: 800px; margin: auto;"></div>
</div>

<div id="game-page" class="page">
    <h1 class="section-title">The Watchman’s Hour</h1>
    <div id="quiz-container">
        <div id="quiz-box">
            <p id="question-text" style="font-size: 1.2rem; margin-bottom: 20px;">A client wants a 100% discount because you are "brothers." Your move?</p>
            <div id="options-container">
                <button class="quiz-option" onclick="handleQuiz(1)" style="width:100%; padding:15px; margin:5px; background:none; border:1px solid #333; color:white; cursor:pointer;">Tell them family pays double.</button>
            </div>
        </div>
        <div id="quiz-result" style="display:none;">
            <h2 id="result-title"></h2>
            <button onclick="showPage('contact')" style="padding:10px 20px; border:1px solid var(--gold); background:none; color:var(--gold); font-family:'Cinzel'; cursor:pointer; margin-top:20px;">MESSAGE THE WATCHMAN</button>
        </div>
    </div>
</div>

<div id="contact" class="page">
    <h1 class="section-title">The Direct Line</h1>
    <div class="contact-box">
        <p style="font-family:'Cinzel'; color:var(--gold); letter-spacing: 2px;">WHATSAPP / CALL</p>
        <h2 style="font-size: 1.8rem; margin: 15px 0;">+264 81 430 8121</h2>
        
        <div class="social-links">
            <a href="https://www.instagram.com/the_watchmans_pen_?igsh=a3c2d3RvZmZ1ZHBx" target="_blank"><i class="fab fa-instagram"></i></a>
            <a href="https://tiktok.com/@the.watchmans.pen" target="_blank"><i class="fab fa-tiktok"></i></a>
            <a href="https://www.youtube.com/@joshuadenzil" target="_blank"><i class="fab fa-youtube"></i></a>
        </div>
    </div>
</div>

<div id="reader">
    <button onclick="closeReader()" style="position:fixed; top:40px; left:40px; background:none; border:1px solid var(--gold); color:var(--gold); padding:10px 20px; cursor:pointer; font-family:'Cinzel';">← CLOSE</button>
    <div id="reader-inner" class="reader-content"></div>
</div>

<a href="https://wa.me/264814308121" class="wa-float" target="_blank"><i class="fab fa-whatsapp"></i></a>

<script>
function toggleNav() { document.getElementById('nav-menu').classList.toggle('open'); }
function showPage(id) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    document.getElementById('reader').style.display = 'none';
    if(document.getElementById('nav-menu').classList.contains('open')) toggleNav();
}

function filterDesigns(sectionId, btn) {
    document.querySelectorAll('.design-grid').forEach(sec => sec.classList.remove('active-section'));
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active-tab'));
    document.getElementById(sectionId).classList.add('active-section');
    btn.classList.add('active-tab');
}

const stories = [
    { title: "The River Spirit's Complaint", text: "<h1>The River Spirit</h1><p>One night, a spirit from the Kavango river told me my screen was too bright for the crocodiles. I told him unless he wanted a rebrand, buy sunglasses. Rude.</p>" },
    { title: "The 'Brother' Discount", text: "<h1>The Brother Price</h1><p>Client asked for a 'brother' price. I said soil is free, but rendering 4K is not. He paid in full.</p>" },
    { title: "The 2 AM Kapana Cure", text: "<h1>Kapana Magic</h1><p>Stuck on a design for hours. Three bites of spicy Kapana later, I saw the layout in the salt. Finished in ten minutes.</p>" },
    { title: "The Now-Now Deadline", text: "<h1>Now-Now</h1><p>Client wanted it 'now-now.' I rushed. He checked it a week later. African timing is a mystery.</p>" }
];

const container = document.getElementById('story-container');
stories.forEach(s => {
    let div = document.createElement('div');
    div.style.padding = '30px'; div.style.border = '1px solid #222'; div.style.marginBottom = '20px'; div.style.cursor = 'pointer';
    div.innerHTML = `<h3 style="font-family:'Cinzel'; color:var(--gold); margin:0;">${s.title}</h3>`;
    div.onclick = () => { document.getElementById('reader-inner').innerHTML = s.text; document.getElementById('reader').style.display = 'block'; };
    container.appendChild(div);
});

function handleQuiz(choice) {
    document.getElementById('quiz-box').style.display = 'none';
    document.getElementById('quiz-result').style.display = 'block';
    document.getElementById('result-title').innerText = "MASTER OF THE HOUR";
}
function closeReader() { document.getElementById('reader').style.display = 'none'; }
</script>
</body>
</html>
