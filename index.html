<style>

.grid-label { color: var(--gold); font-family: 'Cinzel'; margin: 40px 0 20px; border-bottom: 1px solid #333; padding-bottom: 10px; letter-spacing: 3px; font-size: 0.9rem; }

.design-card { border: 1px solid #222; overflow: hidden; height: 350px; background: #000; }
.design-card img, .design-card video { width: 100%; height: 100%; object-fit: cover; }

/* STORIES */

/* READER */
